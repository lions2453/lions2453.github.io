<style>
:root{--bg:#0a0402;--ink:#fff3dc;--mut:#d9b98a;--gold:#ffc83d;--fire:#ff6a00;--red:#c4200f;--card:rgba(24,8,3,.78);--line:rgba(255,170,60,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 100%,#5a1a02 0%,#240a03 40%,#0a0402 80%);color:var(--ink);font:500 17px/1.5 'Rajdhani','Segoe UI',system-ui,sans-serif;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.fire{position:fixed;left:0;right:0;bottom:-6vh;height:60vh;z-index:0;pointer-events:none;filter:blur(18px)}
.fire i{position:absolute;bottom:0;width:34vw;height:100%;border-radius:50% 50% 0 0/80% 80% 0 0;background:radial-gradient(ellipse at 50% 100%,#ffd24a 0%,#ff7a00 35%,rgba(196,32,15,.7) 60%,transparent 75%);transform-origin:50% 100%;animation:fl 2.6s ease-in-out infinite alternate;opacity:.85}
.fire i:nth-child(1){left:-8vw;animation-delay:-.4s}.fire i:nth-child(2){left:14vw;animation-duration:2s;height:80%}.fire i:nth-child(3){left:34vw;animation-delay:-1.1s;height:105%}.fire i:nth-child(4){left:56vw;animation-duration:2.3s;height:85%}.fire i:nth-child(5){left:76vw;animation-delay:-.8s}
@keyframes fl{0%{transform:scaleY(.8) scaleX(.95) skewX(-3deg)}100%{transform:scaleY(1.15) scaleX(1.05) skewX(3deg)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px 16px 90px}
.lang{display:flex;justify-content:flex-end;gap:8px}
.lang button{background:rgba(0,0,0,.5);color:var(--gold);border:1px solid var(--line);padding:6px 14px;border-radius:20px;font:700 15px 'Cinzel',Georgia,'Times New Roman',serif;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:#2a0d00}
.hero{text-align:center;padding:6px 0 18px}
.lion{width:min(94vw,440px);margin:0 auto;display:block;filter:drop-shadow(0 0 28px rgba(255,120,0,.85)) drop-shadow(0 0 60px rgba(255,60,0,.5));}
@keyframes glow{to{filter:drop-shadow(0 0 40px rgba(255,170,0,1)) drop-shadow(0 0 90px rgba(255,70,0,.7))}}
h1{margin:6px 0 0;font:900 clamp(54px,17vw,112px)/1 'Cinzel Decorative','Cinzel',Georgia,'Times New Roman',serif;letter-spacing:.06em;background:linear-gradient(180deg,#fff6c9 0%,#ffc83d 40%,#ff6a00 78%,#b81d08 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(255,120,0,.4);filter:drop-shadow(0 4px 12px rgba(255,80,0,.6))}
.sub{font:700 clamp(15px,4vw,20px) 'Cinzel',Georgia,'Times New Roman',serif;color:var(--gold);letter-spacing:.14em;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-top:18px;backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,200,60,.08) inset,0 10px 40px rgba(0,0,0,.6),0 0 40px rgba(255,90,0,.18)}
h2{font:700 21px 'Cinzel',Georgia,'Times New Roman',serif;color:var(--gold);margin:0 0 10px}
.rules{margin:0;padding-left:20px;color:var(--ink)}.rules li{margin:6px 0}
.rules b{color:var(--gold)}
label{display:block;margin:14px 0 4px;color:var(--mut);font-size:16px}
input,select{width:100%;background:rgba(0,0,0,.55);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:600 17px 'Rajdhani',sans-serif}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}.row .u{flex:0 0 84px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:14px;color:var(--mut);margin-top:3px}
.tot{margin-top:16px;padding:12px;border:1px dashed var(--line);border-radius:8px;font-weight:600}
.tot b{color:var(--gold);font-size:20px}.warn{color:#ff8a5c;font-size:15px;display:block;min-height:1em}
.btns{display:flex;gap:12px;margin-top:22px}
.btn{flex:1;border:0;border-radius:10px;padding:14px;font:700 17px 'Cinzel',Georgia,'Times New Roman',serif;cursor:pointer;color:#2a0d00;background:linear-gradient(180deg,#ffe07a,#ff9b1a 60%,#ff6a00);box-shadow:0 0 22px rgba(255,120,0,.6)}
.btn.g{background:rgba(0,0,0,.5);color:var(--gold);border:1px solid var(--line);box-shadow:none}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:18px;color:var(--ink)}.chk input{width:22px;height:22px;margin-top:3px;accent-color:#ff8a00;flex:none}
.err{color:#ff8a5c;margin-top:12px;font-weight:600;min-height:1em}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:8px;padding:12px;font:500 15px/1.45 'Rajdhani',monospace;max-height:260px;overflow:auto}
a.btn{display:block;text-align:center;text-decoration:none}
[hidden]{display:none!important}
.foot{text-align:center;color:var(--mut);font-size:14px;margin-top:26px}
@media(prefers-reduced-motion:reduce){.fire i,.lion{animation:none}}

.wrap{display:grid;grid-template-columns:minmax(0,1fr)}
.vis{position:relative;z-index:1;background:#0a0402;aspect-ratio:1/1;max-height:82vh;width:100%;overflow:hidden}
.ph{width:100%;height:100%;object-fit:cover;object-position:50% 38%;display:block;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent);mask-image:linear-gradient(to bottom,#000 72%,transparent)}
.vis:after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(to top,rgba(196,60,10,.55),rgba(255,120,0,.15) 60%,transparent);pointer-events:none}
.ttl{z-index:2;position:absolute;left:0;right:0;bottom:3%;text-align:center;padding:0 12px}
.ttl h1{margin:0}
main{max-width:none}
@media(min-width:960px){
.wrap{grid-template-columns:minmax(0,1.08fr) minmax(480px,.92fr);min-height:100vh}
.vis{position:sticky;top:0;height:100vh;max-height:none;aspect-ratio:auto}
.ph{object-position:50% 35%;-webkit-mask-image:linear-gradient(to right,#000 70%,transparent);mask-image:linear-gradient(to right,#000 70%,transparent)}
.ttl{bottom:6%;padding-right:8%}
.ttl h1{font-size:clamp(72px,9vw,160px)}
main{align-self:center;padding:36px clamp(20px,4vw,72px) 60px 0;max-width:720px;width:100%}
}
@media(min-width:1600px){body{font-size:19px}main{max-width:820px}}
</style>
