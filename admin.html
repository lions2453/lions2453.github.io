<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; connect-src https://wxhzhxvczttgxqgmmtln.supabase.co; img-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>LIONS 2453 – Yönetici Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0402;--ink:#fff3dc;--mut:#d9b98a;--gold:#ffc83d;--line:rgba(255,170,60,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse at 50% 100%,#3a1203 0%,#0a0402 70%) fixed;color:var(--ink);font:500 16px/1.45 'Rajdhani','Segoe UI',system-ui,sans-serif;min-height:100vh}
h1{font:700 clamp(30px,7vw,44px) 'Cinzel',Georgia,serif;color:var(--gold);margin:0 0 6px}
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
.login p{color:var(--mut);margin:0 0 22px}
input{width:100%;max-width:340px;padding:12px;background:rgba(0,0,0,.55);border:1px solid var(--line);color:var(--ink);font:600 17px 'Rajdhani',sans-serif;border-radius:8px;margin:6px 0}
input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.big{width:100%;max-width:340px;margin-top:12px;padding:13px;background:linear-gradient(180deg,#ffe07a,#ff8a00);color:#2a0d00;border:0;border-radius:8px;font:700 16px 'Cinzel',Georgia,serif;cursor:pointer}
.err{color:#ff8a5c;min-height:1.4em;margin-top:10px;font-weight:600}
.panel{display:none;padding:20px 16px 60px;max-width:1300px;margin:0 auto}
.top{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.top button,.del{padding:9px 14px;background:#ff6a00;color:#fff;border:0;border-radius:6px;cursor:pointer;font:700 14px 'Rajdhani',sans-serif}
.top .out,.del{background:#b01d0c}
.count{color:var(--gold);font-weight:700;margin:4px 0 12px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.55)}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{padding:10px;text-align:left;border-bottom:1px solid rgba(255,170,60,.18);font-size:14px;white-space:nowrap}
th{background:rgba(255,120,0,.18);color:var(--gold);position:sticky;top:0}
tr:hover td{background:rgba(255,120,0,.06)}
.empty{text-align:center;color:var(--mut);padding:40px}
a{color:var(--gold)}
</style>
</head>
<body>
<div class="login" id="login">
<h1>LIONS 2453</h1>
<p>Yönetici paneli</p>
<input type="email" id="em" placeholder="E-posta" autocomplete="username">
<input type="password" id="pw" placeholder="Şifre" autocomplete="current-password">
<button class="big" id="lg">Giriş yap</button>
<div class="err" id="le" role="alert"></div>
</div>

<div class="panel" id="panel">
<h1>Başvurular</h1>
<div class="top">
<button id="rf">Yenile</button>
<button id="csv">CSV indir</button>
<button class="out" id="lo">Çıkış</button>
</div>
<div class="err" id="pe" role="alert"></div>
<div class="count" id="count"></div>
<div class="wrap" id="wrap" hidden><table><thead><tr>
<th>Tarih</th><th>ID</th><th>Nickname</th><th>Power</th><th>Kill Points</th><th>VIP</th><th>Bütçe $</th><th>Hedef DKP</th><th>WhatsApp</th><th>Pilot</th><th>Food</th><th>Wood</th><th>Stone</th><th>Gold</th><th>Training</th><th>Healing</th><th>Universal</th><th></th>
</tr></thead><tbody id="tb"></tbody></table></div>
<div class="empty" id="empty" hidden>Henüz başvuru yok.</div>
</div>

<script>
(function(){
"use strict";
var URL="https://wxhzhxvczttgxqgmmtln.supabase.co",KEY="sb_publishable_Mv8LPVt5VAQIE6QL2WyBeQ_fpk2I4JA";
var COLS=["created_at","pid","nickname","power","kp","vip","budget","dkp","wa1","wa2","food","wood","stone","gold","train","heal","uni"];
var $=function(i){return document.getElementById(i)},rows=[];
function tok(){try{return sessionStorage.getItem("l_tok")}catch(e){return null}}
function setTok(t){try{t?sessionStorage.setItem("l_tok",t):sessionStorage.removeItem("l_tok")}catch(e){}}
function hdr(){return{"apikey":KEY,"Authorization":"Bearer "+tok(),"Content-Type":"application/json"}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function login(){
$("le").textContent="";var em=$("em").value.trim(),pw=$("pw").value;
if(!em||!pw){$("le").textContent="E-posta ve şifreyi girin.";return}
$("lg").disabled=true;
fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})})
.then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
.then(function(o){$("lg").disabled=false;
if(!o.ok||!o.j.access_token){$("le").textContent="Giriş başarısız: e-posta veya şifre yanlış.";return}
setTok(o.j.access_token);$("pw").value="";show()})
.catch(function(){$("lg").disabled=false;$("le").textContent="Bağlantı hatası, tekrar deneyin."})}

function show(){$("login").style.display="none";$("panel").style.display="block";load()}
function logout(){setTok(null);location.reload()}

function load(){
$("pe").textContent="";
fetch(URL+"/rest/v1/apps?select=*&order=created_at.desc",{headers:hdr()})
.then(function(r){if(r.status===401){logout();return null}return r.json().then(function(j){return{ok:r.ok,j:j,s:r.status}})})
.then(function(o){if(!o)return;
if(!o.ok){$("pe").textContent="Veri alınamadı (HTTP "+o.s+"). "+(o.j&&o.j.message||"");return}
rows=o.j;render()})
.catch(function(){$("pe").textContent="Bağlantı hatası."})}

function render(){
var tb=$("tb");tb.innerHTML="";
$("count").textContent="Toplam: "+rows.length;
$("wrap").hidden=!rows.length;$("empty").hidden=!!rows.length;
rows.forEach(function(r){
var tr=document.createElement("tr"),h="";
COLS.forEach(function(c){var v=c==="created_at"?new Date(r[c]).toLocaleString("tr-TR"):r[c];
if((c==="wa1"||c==="wa2")&&v&&v!=="-"){var d=String(v).replace(/[^0-9]/g,"");h+='<td><a href="https://wa.me/'+esc(d)+'" target="_blank" rel="noopener noreferrer">'+esc(v)+'</a></td>'}
else h+="<td>"+esc(v)+"</td>"});
h+='<td><button class="del" data-id="'+esc(r.id)+'">Sil</button></td>';
tr.innerHTML=h;tb.appendChild(tr)})}

function del(id){
if(!confirm("Bu başvuruyu silmek istediğinizden emin misiniz?"))return;
fetch(URL+"/rest/v1/apps?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:hdr()})
.then(function(r){if(!r.ok){$("pe").textContent="Silinemedi (HTTP "+r.status+")."}load()})
.catch(function(){$("pe").textContent="Bağlantı hatası."})}

function csv(){
var q=function(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
var out=[COLS.join(",")].concat(rows.map(function(r){return COLS.map(function(c){return q(r[c])}).join(",")})).join("\r\n");
var b=new Blob(["\ufeff"+out],{type:"text/csv;charset=utf-8"}),u=URL_.createObjectURL(b),a=document.createElement("a");
a.href=u;a.download="lions2453-basvurular.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL_.revokeObjectURL(u)},1000)}
var URL_=window.URL;

$("lg").onclick=login;
$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")login()});
$("rf").onclick=load;$("csv").onclick=csv;$("lo").onclick=logout;
$("tb").addEventListener("click",function(e){var b=e.target.closest(".del");if(b)del(b.getAttribute("data-id"))});
if(tok())show();
})();
</script>
</body>
</html>
